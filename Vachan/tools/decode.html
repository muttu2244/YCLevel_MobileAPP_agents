<script>
function ascii85(str){
  const bytes=[]; let acc=0,n=0;
  for(let i=0;i<str.length;i++){
    const c=str[i];
    if(c==='~') break;
    if(/\s/.test(c)) continue;
    if(c==='z'&&n===0){bytes.push(0,0,0,0);continue;}
    const v=c.charCodeAt(0)-33;
    if(v<0||v>84) continue;
    acc=acc*85+v; n++;
    if(n===5){bytes.push(Math.floor(acc/16777216)%256,Math.floor(acc/65536)%256,Math.floor(acc/256)%256,acc%256);acc=0;n=0;}
  }
  if(n>0){for(let k=n;k<5;k++) acc=acc*85+84;
    const b=[Math.floor(acc/16777216)%256,Math.floor(acc/65536)%256,Math.floor(acc/256)%256,acc%256];
    for(let k=0;k<n-1;k++) bytes.push(b[k]);}
  return new Uint8Array(bytes);
}
window.__report={};
(async()=>{
  const raw=document.getElementById('s16').textContent;
  window.__report.srcLen=raw.length;
  const dec=ascii85(raw);
  window.__report.decodedBytes=dec.length;
  try{
    const st=new Blob([dec]).stream().pipeThrough(new DecompressionStream('deflate'));
    const inf=new Uint8Array(await new Response(st).arrayBuffer());
    window.__report.inflate='ok';
    window.__report.inflatedBytes=inf.length;
    window.__report.text=new TextDecoder('latin1').decode(inf).slice(0,900);
  }catch(e){ window.__report.inflate='FAIL: '+e.message; }
  document.getElementById('out').textContent=JSON.stringify(window.__report,null,1);
})();
